# Parameters used to generate this project with aem-project-archetype

groupId=com.example.aem
artifactId=jenkins-aem-project
version=1.0.0-SNAPSHOT
package=com.example.aem
appId=jenkins-aem-project
appTitle=Jenkins AEM Project
aemVersion=6.5.0
sdkVersion=latest
